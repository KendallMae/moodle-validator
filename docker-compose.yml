services:
  db:
    image: mariadb:10.11
    command: --innodb-file-per-table=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodleuser
      - MYSQL_PASSWORD=moodlepass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle:
    image: pasechnik/moodle_lts_images:5.1.0-lts
    platform: linux/amd64
    ports:
      - "8080:80"
    volumes:
      - moodledata:/var/www/moodledata
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  moodledata:
